# Embedded-LLM overflow to RunPod through the tools/llm_overflow.py sidecar
# (systemd/omniserve-llm-overflow.service): when 32 local sequences are busy
# or no slot is free, interactive requests go to the sidecar, which picks a
# dedicated pod or the scale-to-zero serverless endpoint. A relay that fails
# before any bytes falls back to the local queue. Background stays local.
# Install as /etc/systemd/system/omniserve-native.service.d/zzzzzzzzzz-llm-overflow.conf
[Service]
Environment=OMNISERVE_NATIVE_LLM_OVERFLOW_UPSTREAM=http://127.0.0.1:18796
Environment=OMNISERVE_NATIVE_LLM_OVERFLOW_TIERS=paid,sub,free
