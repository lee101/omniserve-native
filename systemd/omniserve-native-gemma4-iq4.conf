# Optional drop-in for the shared 32 GiB RTX 5090 profile.
# Install as /etc/systemd/system/omniserve-native.service.d/gemma4-iq4.conf
# only on a host with this checkpoint and enough host RAM for the GGUF mmap.
[Service]
Environment=OMNISERVE_NATIVE_LLM_GGUF=/nvme0n1-disk/models/omniserve-native/G4-MEROMERO-V2-31B-IQ4_XS.gguf
Environment=OMNISERVE_NATIVE_LLM_SWAP_DIR=/nvme0n1-disk/models/omniserve-native
Environment=OMNISERVE_NATIVE_NGL=20
Environment=OMNISERVE_NATIVE_NGL_AUTO_KEEP_FREE_MB=7168
Environment=OMNISERVE_NATIVE_CTX=4096
Environment=OMNISERVE_NATIVE_LLM_CONTEXTS=1
Environment=OMNISERVE_NATIVE_KV_TYPE=q8_0
Environment=OMNISERVE_NATIVE_BATCH=auto
Environment=OMNISERVE_NATIVE_UBATCH=auto
