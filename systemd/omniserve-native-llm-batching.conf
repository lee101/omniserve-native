# Continuous batching for the embedded LLM (gemma-roleplay-v2 q8_0, full GPU).
# Install as /etc/systemd/system/omniserve-native.service.d/zzzzzzzzzz-llm-batching.conf
# (sorts after zz-gemma-fullgpu.conf so these values win). Rollback: delete the
# file, daemon-reload, restart; OMNISERVE_NATIVE_LLM_BATCHED=0 alone restores
# the per-slot contexts with this binary.
[Service]
# Sequences sharing one context. KV is q8_0 and Gemma 4 keeps most layers on a
# 512-token window, so 16 x 4096 costs ~0.4 GiB more than the 2 contexts it
# replaces (see performance/llm-continuous-batching-2026-10-21.md).
Environment=OMNISERVE_NATIVE_LLM_CONTEXTS=16
# Admission: LLM_PERMITS is the weight of one request in the SLOTS pool, not a
# concurrency limit. At SLOTS=8, PERMITS=2 admits 4 LLM requests; PERMITS=1
# admits 8, which the engine batches into one decode step.
Environment=OMNISERVE_NATIVE_LLM_PERMITS=1
Environment=OMNISERVE_NATIVE_LLM_BATCHED=1
Environment=OMNISERVE_NATIVE_LLM_STEP_TOKENS=512
Environment=OMNISERVE_NATIVE_LLM_SHARE_PREFIX=1
