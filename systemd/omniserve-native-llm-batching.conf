# Continuous batching for the embedded LLM (gemma-roleplay-v2 q8_0, full GPU).
# Install as /etc/systemd/system/omniserve-native.service.d/zzzzzzzzzz-llm-batching.conf
# (sorts after zz-gemma-fullgpu.conf and the prod-* ExecStart drop-ins so these
# values win). Rollback: delete the file, daemon-reload, restart;
# OMNISERVE_NATIVE_LLM_BATCHED=0 alone restores per-slot contexts.
[Service]
ExecStart=
ExecStart=/nvme0n1-disk/code/omniserve-native-deploy/deploy-prod-20261021-llmbatch/omniserve-native --port 8791
# Sequences sharing one context: ~120 MiB of KV each at q8_0, CTX 4096,
# swa_full. 16 x 4096 costs ~1.1 GiB more than the 2 legacy contexts.
Environment=OMNISERVE_NATIVE_LLM_CONTEXTS=16
# Admission: LLM_PERMITS is the weight of one request in the SLOTS pool, not a
# concurrency limit. SLOTS doubles from 8 to 16 so the LLM can admit 16; every
# other modality's weight doubles with it, which keeps their limits unchanged.
Environment=OMNISERVE_NATIVE_SLOTS=16
Environment=OMNISERVE_NATIVE_LLM_PERMITS=1
Environment=OMNISERVE_NATIVE_IMAGE_PERMITS=2
Environment=OMNISERVE_NATIVE_BIREFNET_PERMITS=2
Environment=OMNISERVE_NATIVE_FORECAST_PERMITS=4
Environment=OMNISERVE_NATIVE_TRAINING_PERMITS=16
Environment=OMNISERVE_NATIVE_TTS_PERMITS=4
Environment=OMNISERVE_NATIVE_STT_PERMITS=4
Environment=OMNISERVE_NATIVE_EMBEDDING_PERMITS=2
Environment=OMNISERVE_NATIVE_MULTIMODAL_PERMITS=4
Environment=OMNISERVE_NATIVE_3D_PERMITS=16
Environment=OMNISERVE_NATIVE_AUX_PERMITS=2
# Background LLM requests otherwise take the whole pool and run one at a time.
# At 4 they still queue behind every other tier but decode in the same batch
# (at most 4 at once).
Environment=OMNISERVE_NATIVE_LLM_BACKGROUND_PERMITS=4
Environment=OMNISERVE_NATIVE_LLM_BATCHED=1
Environment=OMNISERVE_NATIVE_LLM_STEP_TOKENS=512
Environment=OMNISERVE_NATIVE_LLM_SHARE_PREFIX=1
# One line per 512 engine steps: decode ms by step kind, sampling ms.
Environment=OMNISERVE_NATIVE_LLM_ENGINE_TRACE=1
