# Continuous batching for the embedded LLM (gemma-roleplay-v2 q8_0, full GPU).
# Install as /etc/systemd/system/omniserve-native.service.d/zzzzzzzzzz-llm-batching.conf
# (sorts after zz-gemma-fullgpu.conf and the prod-* ExecStart drop-ins so these
# values win). Rollback: delete the file, daemon-reload, restart;
# OMNISERVE_NATIVE_LLM_BATCHED=0 alone restores per-slot contexts.
[Service]
ExecStart=
ExecStart=/nvme0n1-disk/code/omniserve-native-deploy/deploy-prod-20261021-llmbatch/omniserve-native --port 8791
# Sequences sharing one context. The KV pool holds LLM_KV_SEQS full 4096-token
# contexts (~120 MiB each at q8_0 with swa_full), shared by all sequences:
# roleplay contexts are short and forked personas share cells, and idle cached
# prefixes are evicted (then prefills requeued) when it fills. 8 keeps the LLM
# within ~0.5 GiB of the legacy 2 contexts; the image lane needs the headroom.
Environment=OMNISERVE_NATIVE_LLM_CONTEXTS=32
Environment=OMNISERVE_NATIVE_LLM_KV_SEQS=8
# Admission: LLM_PERMITS is the weight of one request in the SLOTS pool, not a
# concurrency limit. SLOTS goes from 8 to 32 so the LLM can admit 32; every
# other modality's weight scales 4x with it, which keeps their limits unchanged.
Environment=OMNISERVE_NATIVE_SLOTS=32
Environment=OMNISERVE_NATIVE_LLM_PERMITS=1
Environment=OMNISERVE_NATIVE_IMAGE_PERMITS=4
Environment=OMNISERVE_NATIVE_BIREFNET_PERMITS=4
Environment=OMNISERVE_NATIVE_FORECAST_PERMITS=8
Environment=OMNISERVE_NATIVE_TRAINING_PERMITS=32
Environment=OMNISERVE_NATIVE_TTS_PERMITS=8
Environment=OMNISERVE_NATIVE_STT_PERMITS=8
Environment=OMNISERVE_NATIVE_EMBEDDING_PERMITS=4
Environment=OMNISERVE_NATIVE_MULTIMODAL_PERMITS=8
Environment=OMNISERVE_NATIVE_3D_PERMITS=32
Environment=OMNISERVE_NATIVE_AUX_PERMITS=4
# Background LLM requests otherwise take the whole pool and run one at a time.
# At 8 they still queue behind every other tier but decode in the same batch
# (at most 4 at once).
Environment=OMNISERVE_NATIVE_LLM_BACKGROUND_PERMITS=8
Environment=OMNISERVE_NATIVE_LLM_BATCHED=1
# A streaming request holds an HTTP worker for its whole reply; 32 sequences
# plus image/proxy traffic exceed the default 32 workers.
Environment=OMNISERVE_NATIVE_WORKERS=96
Environment=OMNISERVE_NATIVE_LLM_STEP_TOKENS=512
Environment=OMNISERVE_NATIVE_LLM_SHARE_PREFIX=1
# One line per 512 engine steps: decode ms by step kind, sampling ms.
Environment=OMNISERVE_NATIVE_LLM_ENGINE_TRACE=1
