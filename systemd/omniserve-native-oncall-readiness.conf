[Service]
# Keep the start job open until model loading has completed and the gateway is
# actually ready. The on-call unit is ordered after this service's start job.
# A failed readiness check fails the start job, so Restart=always still retries.
TimeoutStartSec=240
ExecStartPost=/bin/sh -c 'for i in $(seq 1 60); do curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8791/readyz && exit 0; sleep 1; done; echo "gateway did not become ready" >&2; exit 1'
