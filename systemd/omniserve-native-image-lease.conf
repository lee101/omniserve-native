# Z-Image workspace for the resident (zimage-resident) profile. A 1024x1024
# generation grows the gateway by 1666 MB on the 5090 (measured 2026-10-21);
# 4096 refused most background images once BiRefNet's lease was charged.
# Scaled by pixels: 512x512 asks ~1350 MB. Install as
# /etc/systemd/system/omniserve-native.service.d/zzzzzzzzzz-image-lease.conf
# VAE tiles 80 instead of 64: 1024^2 decodes as 2x2 tiles instead of 3x3, 1.68 -> 1.25 s on a
# 3090 Ti; the VAE compute buffer (the generation's peak) grows 1664 -> 2600 MB, so the
# lease grows by the same ~900 MB.
[Service]
Environment=OMNISERVE_NATIVE_SD_MIN_FREE_MB=3200
Environment=OMNISERVE_NATIVE_SD_VAE_TILE_X=80
Environment=OMNISERVE_NATIVE_SD_VAE_TILE_Y=80
Environment=OMNISERVE_NATIVE_SD_LEASE_SCALE_PIXELS=1
# stable-diffusion.cpp built with GGML_CUDA_GRAPHS=ON plus runtime/sdcpp-lora-fast.patch and
# runtime/ggml-im2col-tiled.patch (shared-memory im2col, bit-identical, VAE decode -22%)
# (LoRA factors in F32, stacked q/k/v, rank-side scale; SD_LORA_FAST_LINEAR=0 reverts): each
# denoise step replays one CUDA graph instead of launching every kernel from
# the host CPU. Bit-identical images at 512/1024/768x1024; 4-6% faster on a
# 3090 Ti, more on prod's slower host CPU.
Environment=OMNISERVE_NATIVE_SD_LIB=/nvme0n1-disk/code/omniserve-native-deploy/sd-20261022-im2col/libstable-diffusion.so
