[Service]
# 2026-10-09 demand-driven image residency (branch ra2-residency, performance/ra2-residency-2026-10-09.md).
# :8791 hosts the arbiter (/v1/gpu/residency) and its own Z-Image claim. Base SD_* = streamed profile
# (pre-2026-10-09 config), SD_RESIDENT_* = the zzzzzzz-zimage-resident.conf profile. Z-Image stays resident
# while no other image lane is active and demotes while a Qwen lane needs its ~10 GB streamed render.
# Rollback: sudo rm this file && sudo systemctl daemon-reload && sudo systemctl restart omniserve-native
ExecStart=
ExecStart=@DEPLOY@/omniserve-native --port 8791
Environment=OMNISERVE_NATIVE_SD_RESIDENCY=demand
Environment=OMNISERVE_NATIVE_SD_PARAMS_BACKEND=cpu
Environment=OMNISERVE_NATIVE_SD_STREAM_LAYERS=1
Environment=OMNISERVE_NATIVE_SD_MAX_VRAM=2
Environment=OMNISERVE_NATIVE_SD_RESIDENT_PARAMS_BACKEND=
Environment=OMNISERVE_NATIVE_SD_RESIDENT_STREAM_LAYERS=0
Environment=OMNISERVE_NATIVE_SD_RESIDENT_MAX_VRAM=
Environment=OMNISERVE_NATIVE_SD_RESIDENT_EAGER_LOAD=1
Environment=OMNISERVE_NATIVE_SD_RESIDENT_MB=6800
Environment=OMNISERVE_NATIVE_SD_STREAM_MB=3072
Environment=OMNISERVE_NATIVE_SD_RESIDENT_SAVED_MS=14000
Environment=OMNISERVE_NATIVE_SD_RESIDENT_LEASE_MB=4096
Environment=OMNISERVE_NATIVE_RESIDENCY_MIN_HOLD_S=120
Environment=OMNISERVE_NATIVE_RESIDENCY_RESERVE_IDLE_S=180
Environment=OMNISERVE_NATIVE_RESIDENCY_IDLE_RELEASE_S=900
