[Service]
# 2026-10-09 demand-driven image residency (branch ra2-residency, performance/ra2-residency-2026-10-09.md).
# Reports demand to the :8791 arbiter every 3 s; promotes to fully resident only when the arbiter grants
# ~11.5 GB (in practice: Z-Image demoted and gemma/birefnet small). Against an :8791 without the arbiter the
# lane stays streamed (reason no_arbiter, re-asked every 5 min), i.e. today's behaviour.
# Rollback: sudo rm this file && sudo systemctl daemon-reload && sudo systemctl restart omniserve-native-qwen
ExecStart=
ExecStart=@DEPLOY@/omniserve-native-qwen --port 8792
Environment=OMNISERVE_NATIVE_SD_RESIDENCY=demand
Environment=OMNISERVE_NATIVE_SD_RESIDENT_PARAMS_BACKEND=
Environment=OMNISERVE_NATIVE_SD_RESIDENT_MB=11500
Environment=OMNISERVE_NATIVE_SD_STREAM_MB=10240
Environment=OMNISERVE_NATIVE_SD_RESIDENT_SAVED_MS=4000
Environment=OMNISERVE_NATIVE_SD_RESIDENT_LEASE_MB=3072
Environment=OMNISERVE_NATIVE_SD_RESIDENT_EDIT_LEASE_MB=4096
