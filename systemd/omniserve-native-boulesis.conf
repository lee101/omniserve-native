# Boulesis-v2.1-26B-A4B profile for the shared 32 GiB RTX 5090.
# Install as /etc/systemd/system/omniserve-native.service.d/boulesis.conf
# only on a host with this checkpoint and enough host RAM for the GGUF mmap
# (experts spill to CPU when VRAM is short; ~16 GiB file, ~250 GB host RAM).
[Service]
Environment=OMNISERVE_NATIVE_LLM_GGUF=/nvme0n1-disk/models/omniserve-native/Boulesis-v2.1-26B-A4B.i1-Q4_K_S.gguf
Environment=OMNISERVE_NATIVE_LLM_SWAP_DIR=/nvme0n1-disk/models/omniserve-native
Environment=OMNISERVE_NATIVE_NGL=auto
Environment=OMNISERVE_NATIVE_NGL_AUTO_KEEP_FREE_MB=2048
Environment=OMNISERVE_NATIVE_MOE_CPU_EXPERTS=auto
Environment=OMNISERVE_NATIVE_CTX=4096
Environment=OMNISERVE_NATIVE_LLM_CONTEXTS=2
Environment=OMNISERVE_NATIVE_KV_TYPE=q8_0
Environment=OMNISERVE_NATIVE_BATCH=auto
Environment=OMNISERVE_NATIVE_UBATCH=auto
Environment=OMNISERVE_NATIVE_LLM_THREADS=16
Environment=OMNISERVE_NATIVE_LLM_THREADS_BATCH=16
Environment=OMNISERVE_NATIVE_SPEC_DRAFT=0
Environment=OMNISERVE_NATIVE_LLM_THINKING_DEFAULT=0

# Content guard: lexical + embedding + ShieldGemma judge. The judge runs on the
# GPU (~1.9 GiB incl. context) and the MoE auto-placement subtracts that
# reservation, so expert layers move to CPU before the judge is starved.
Environment=OMNISERVE_NATIVE_GUARD=1
Environment=OMNISERVE_NATIVE_GUARD_JUDGE=1
Environment=OMNISERVE_NATIVE_GUARD_JUDGE_GGUF=/nvme0n1-disk/models/omniserve-native/shieldgemma-2b-q4_k_m.gguf
Environment=OMNISERVE_NATIVE_EMBEDDING_GGUF=/nvme0n1-disk/models/omniserve-native/gte-modernbert-base-q8_0.gguf
Environment=OMNISERVE_NATIVE_EMBEDDING_NGL=0
Environment=OMNISERVE_NATIVE_EMBEDDING_POOLING=cls

# MTP-head speculation: +11% decode at draft 1 on CPU-resident experts, which
# is this profile's placement. Head is ~0.4 GiB beside the target.
Environment=OMNISERVE_NATIVE_SPEC_MTP_GGUF=/nvme0n1-disk/models/omniserve-native/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
Environment=OMNISERVE_NATIVE_SPEC_MTP_DRAFT=1
Environment=OMNISERVE_NATIVE_SPEC_MTP_P_MIN=0

# NOTE: OMNISERVE_NATIVE_SLOTS is deliberately NOT set here. It is the GLOBAL
# admission pool for every modality (production runs 8); LLM concurrency is
# bounded by OMNISERVE_NATIVE_LLM_PERMITS (default 1) and LLM_CONTEXTS.

# Conservative set for when only ~6 GiB is free: all experts on CPU, ~2.8 GiB
# GPU. Uncomment the line below (keep the rest) to pin it.
# Environment=OMNISERVE_NATIVE_MOE_CPU_EXPERTS=all
# Speed alternative when >=7.5 GiB is free: pin 6 GPU expert layers
# (~5.5 GiB, fastest measured single-stream). Fails closed below that.
# Environment=OMNISERVE_NATIVE_MOE_CPU_EXPERTS=24
