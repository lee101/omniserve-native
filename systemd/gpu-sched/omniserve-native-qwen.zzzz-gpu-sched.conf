[Service]
# Qwen ra2 gateway leases its render peak from the :8791 broker (fails open if :8791 is down).
# Rollback: sudo rm this file && sudo systemctl daemon-reload && sudo systemctl restart omniserve-native-qwen
ExecStart=
ExecStart=/nvme0n1-disk/code/omniserve-native-sched/deploy-sched-e2138ae/omniserve-native-qwen --port 8792
Environment=OMNISERVE_NATIVE_VRAM_BROKER_URL=http://127.0.0.1:8791
Environment=OMNISERVE_NATIVE_VRAM_OWNER=qwen-ra2
Environment=OMNISERVE_NATIVE_SD_LEASE_MB=10240
Environment=OMNISERVE_NATIVE_SD_EDIT_LEASE_MB=11264
Environment=OMNISERVE_NATIVE_SD_LEASE_SCALE_PIXELS=1
# Advisory: after a short queue Qwen runs anyway holding a forced lease, so Z-Image queues behind it
# instead of both racing into OOM (Qwen keeps its pre-broker behaviour).
Environment=OMNISERVE_NATIVE_VRAM_FORCE_TIERS=paid,sub,free,background
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_PAID=20000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_SUB=20000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_FREE=25000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_BACKGROUND=30000
# The ra2-moe binary carries main's guard; this gateway serves images only.
Environment=OMNISERVE_NATIVE_GUARD=0
Environment=OMNISERVE_NATIVE_GUARD_JUDGE=0
