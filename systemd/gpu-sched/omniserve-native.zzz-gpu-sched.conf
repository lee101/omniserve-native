[Service]
# GPU scheduler (branch gpu-sched e2138ae): queued VRAM leases by tier, box-wide ledger at /v1/gpu/status,
# idle-LLM eviction under pressure. Rollback: sudo rm this file && sudo systemctl daemon-reload && sudo systemctl restart omniserve-native
ExecStart=
ExecStart=/nvme0n1-disk/code/omniserve-native-sched/deploy-sched-e2138ae/omniserve-native --port 8791
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_PAID=60000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_SUB=45000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_FREE=30000
Environment=OMNISERVE_NATIVE_VRAM_WAIT_MS_BACKGROUND=20000
Environment=OMNISERVE_NATIVE_VRAM_PRESSURE_AFTER_MS=1500
Environment=OMNISERVE_NATIVE_VRAM_BLOCK_MAX_S=30
Environment=OMNISERVE_NATIVE_VRAM_JOB_LEASE_S=180
# Z-Image lease stays = SD_MIN_FREE_MB (4096): a smaller lease would pass the queue but then fail
# the 4096 MB point check (kept because the conditioner aborts the process under CUDA pressure).
# Measured in-flight growth is <=1.7 GB; lease credit already returns the unused part to others.
Environment=OMNISERVE_NATIVE_EVICT_LLM_IDLE_S=600
Environment=OMNISERVE_NATIVE_EVICT_LLM_MAX_TIER=sub
Environment=OMNISERVE_NATIVE_GUARD_JUDGE_AUTO=0
